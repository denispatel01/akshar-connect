    <style>#ac-splash{z-index:9999;opacity:0;background:#001a33;justify-content:center;align-items:flex-end;transition:opacity .45s;display:flex;position:fixed;inset:0}#ac-splash.ac-show{opacity:1}#ac-splash.ac-hide{opacity:0;pointer-events:none}#ac-splash .bg{object-fit:cover;object-position:center top;width:100%;height:100%;position:absolute;inset:0}#ac-splash .grad{background:linear-gradient(#00142d59 0%,#00142d8c 55%,#00142deb 100%);position:absolute;inset:0}#ac-splash .fg{text-align:center;color:#fff;flex-direction:column;align-items:center;gap:12px;padding-bottom:11vh;font-family:system-ui,-apple-system,sans-serif;display:flex;position:relative}#ac-splash .sp{border:4px solid #ffffff40;border-top-color:#ff862a;border-radius:50%;width:38px;height:38px;animation:.9s linear infinite acspin}#ac-splash .t1{letter-spacing:.3px;font-size:22px;font-weight:800}#ac-splash .t2{opacity:.85;font-size:13px;font-weight:600}@keyframes acspin{to{transform:rotate(360deg)}}</style>

  <body>
    <div id="ac-splash">
      <img class="bg" src="images/hari-prabodham.webp" alt="" />
      <div class="grad"></div>
      <div class="fg">

        <div class="t2">Jai Swaminarayan…</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.__acSplashTimer=setTimeout(function(){var e=document.getElementById('ac-splash');if(e)e.classList.add('ac-show');},1000);
      // Self-heal a stuck/black screen. If the app has NOT mounted ~10s after load
      // (e.g. a cached index.html points at a JS chunk that 404s after a deploy —
      // main.jsx never runs, so its own recovery can't fire), drop the service
      // worker + all caches and hard-reload ONCE so the user gets the fresh build.
      window.__acRecover=setTimeout(function(){
        var root=document.getElementById('root');
        if(window.__acMounted||(root&&root.childElementCount>0))return; // app rendered — fine
        try{ if(sessionStorage.getItem('ac-recovered')==='1')return; sessionStorage.setItem('ac-recovered','1'); }catch(e){}
        var reload=function(){ try{ location.reload(); }catch(e){} };
        var clearedCaches=('caches' in window)?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).catch(function(){}):Promise.resolve();
        var unregSW=(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).catch(function(){}):Promise.resolve();
        Promise.all([clearedCaches,unregSW]).then(reload,reload);
      },10000);
    </script>
  </body>
